<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <script>
        const pressed = [];
        const secretCode = 'wesbos';
         window.addEventListener('keyup', (e)=> {
            console.log(e.key);
            pressed.push(e.key);
            pressed.splice(-secretCode.lengh - 1, pressed.length - secretCode.length);
            is(pressed.join('').include(secretCode)) {
                console.log("DING DING");
                cornify.add();
            }
            console.log(pressed);
         })
    </script>
  </body>
</html>
